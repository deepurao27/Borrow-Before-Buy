version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bbb_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bbb_user
      POSTGRES_PASSWORD: bbb_password
      POSTGRES_DB: bbb_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: bbb_mailpit
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP server
      - '8025:8025' # Web UI for viewing emails

volumes:
  postgres_data:
